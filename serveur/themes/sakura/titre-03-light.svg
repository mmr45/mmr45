<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="D'où je viens">
<title>D'où je viens</title>
<defs></defs>
<style>
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.u{stroke-dasharray:100 100;animation:u 9s .3s cubic-bezier(.6,0,.2,1) infinite both}
@keyframes u{0%{stroke-dashoffset:100}10%,80%{stroke-dashoffset:0}92%,100%{stroke-dashoffset:-100}}
.bx{animation:bx 9s .3s ease-in-out infinite}
@keyframes bx{0%,8%,100%{fill-opacity:0}4%{fill-opacity:.25}}
.l{transform-box:fill-box;transform-origin:left;animation:l 1.2s .2s cubic-bezier(.6,0,.2,1) both}
@keyframes l{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>

<g class="in">
  <rect class="bx" x="2" y="26" width="58" height="38" rx="10" fill="#D9467A" fill-opacity="0" stroke="#D9467A" stroke-width="2"/>
  <text x="31" y="52" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="19" font-weight="700" fill="#D9467A" text-anchor="middle">03</text>
  <text x="80" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#3B1726" letter-spacing="-.6">D'où je viens</text>
</g>
<path class="u" pathLength="100" d="M82 80c70-6 150 3 130-3" fill="none" stroke="#D9467A" stroke-width="6" stroke-linecap="round"/>
<rect class="l" x="0" y="102" width="1200" height="1.5" fill="#F5D3DF"/>
<g class="in" style="animation-delay:.3s"><text x="1198" y="52" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#C29CAC" text-anchor="end">// du chantier au code</text></g>
</svg>
