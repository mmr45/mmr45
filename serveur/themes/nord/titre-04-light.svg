<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="Activité">
<title>Activité</title>
<defs></defs>
<style>
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.u{stroke-dasharray:100 100;animation:u 9s .3s cubic-bezier(.6,0,.2,1) infinite both}
@keyframes u{0%{stroke-dashoffset:100}10%,80%{stroke-dashoffset:0}92%,100%{stroke-dashoffset:-100}}
.bx{animation:bx 9s .3s ease-in-out infinite}
@keyframes bx{0%,8%,100%{fill-opacity:0}4%{fill-opacity:.25}}
.l{transform-box:fill-box;transform-origin:left;animation:l 1.2s .2s cubic-bezier(.6,0,.2,1) both}
@keyframes l{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>

<g class="in">
  <rect class="bx" x="2" y="26" width="58" height="38" rx="10" fill="#3B7F95" fill-opacity="0" stroke="#3B7F95" stroke-width="2"/>
  <text x="31" y="52" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="19" font-weight="700" fill="#3B7F95" text-anchor="middle">04</text>
  <text x="80" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#2E3440" letter-spacing="-.6">Activité</text>
</g>
<path class="u" pathLength="100" d="M82 80c70-6 150 3 80-3" fill="none" stroke="#3B7F95" stroke-width="6" stroke-linecap="round"/>
<rect class="l" x="0" y="102" width="1200" height="1.5" fill="#D3D9E3"/>
<g class="in" style="animation-delay:.3s"><text x="1198" y="52" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#97A0B0" text-anchor="end">// données réelles</text></g>
</svg>
