<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Avatar animé d'Osman : un O peint au rouleau autour du symbole du code.">
<title>Avatar animé d'Osman : un O peint au rouleau autour du symbole du code.</title>
<defs>
  <clipPath id="rond"><circle cx="200" cy="200" r="196"/></clipPath>
  <pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#DCEEF1"/></pattern>
  <radialGradient id="gl" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#0F9488" stop-opacity=".12"/><stop offset="1" stop-color="#0F9488" stop-opacity="0"/></radialGradient>
  <linearGradient id="an" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0F9488"/><stop offset=".5" stop-color="#0369A1"/><stop offset="1" stop-color="#0F9488" stop-opacity="0"/></linearGradient></defs>
<style>
.peint{animation:peint 8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes peint{0%,6%{stroke-dashoffset:741.4}55%,90%{stroke-dashoffset:0;opacity:1}97%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:741.4}}
.roul{transform-origin:200px 200px;animation:roul 8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes roul{0%,6%{transform:rotate(0);opacity:1}55%{transform:rotate(360deg);opacity:1}62%,100%{transform:rotate(360deg);opacity:0}}
.anneau{transform-origin:200px 200px;animation:tour 6s linear infinite}@keyframes tour{to{transform:rotate(360deg)}}
.drip{transform-box:fill-box;transform-origin:top;animation:drip 8s infinite}
@keyframes drip{0%,55%{transform:scaleY(0)}75%,90%{transform:scaleY(1);opacity:1}97%,100%{transform:scaleY(1);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>

<g clip-path="url(#rond)"><rect width="400" height="400" fill="#EFF9FA"/><rect width="400" height="400" fill="url(#g)"/><rect width="400" height="400" fill="url(#gl)"/>
  <g class="rm"><path class="drip" style="animation-delay:1.20s" d="M155 310h14v27a7 7 0 0 1-14 0z" fill="#0F9488"/><path class="drip" style="animation-delay:1.45s" d="M187 310h14v45a7 7 0 0 1-14 0z" fill="#0F9488"/><path class="drip" style="animation-delay:1.70s" d="M223 310h14v19a7 7 0 0 1-14 0z" fill="#0F9488"/></g>
  <circle cx="200" cy="200" r="118" fill="none" stroke="#F5FBFC" stroke-width="54"/>
  <circle class="peint" cx="200" cy="200" r="118" fill="none" stroke="#0F9488" stroke-width="54" stroke-linecap="round"
    stroke-dasharray="741.4" transform="rotate(-90 200 200)"/>
  <g class="roul rm"><g transform="translate(200 82)">
    <path d="M0 -36V-58H34V-74" fill="none" stroke="#4D6F7C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="-96" width="16" height="26" rx="6" fill="#93AFB9"/>
    <rect x="-16" y="-36" width="32" height="72" rx="11" fill="#0B2A36"/><rect x="-16" y="-36" width="32" height="72" rx="11" fill="#0F9488" fill-opacity=".45"/>
    <path d="M-8 -28V28M0 -28V28M8 -28V28" stroke="#0F9488" stroke-opacity=".5" stroke-width="2"/></g></g>
  <text x="200" y="212" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="40" font-weight="800" fill="#0B2A36" text-anchor="middle">&lt;/&gt;</text>
</g>
<circle class="anneau" cx="200" cy="200" r="193" fill="none" stroke="url(#an)" stroke-width="6"/>
<circle cx="200" cy="200" r="196" fill="none" stroke="#CDE6EA" stroke-width="2"/>
</svg>
