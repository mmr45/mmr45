  <g transform="translate(224 80)">
    <rect x="0" y="-17" width="122" height="32" rx="16" fill="#15803D" fill-opacity=".14"/>
    <circle class="pulse" cx="20" cy="1" r="6" fill="#15803D"/>
    <text x="34" y="5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#15803D">en ligne</text>
  </g>
</g>
<g class="up" style="animation-delay:.35s">
  <text x="56" y="184" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="23" font-weight="400" fill="#4D6F7C">Le coach qui croise sommeil,</text>
  <text x="56" y="214" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="23" font-weight="400" fill="#4D6F7C">sport et alimentation.</text>
</g>
