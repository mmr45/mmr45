  <text x="644" y="85" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="400" fill="#4D6F7C">my-watt-up.vercel.app</text>
  <g clip-path="url(#shot)">
    <rect x="524" y="102" width="640" height="400" fill="#fff"/>
    <image class="defile" x="524" y="102" width="640" height="1200" preserveAspectRatio="xMidYMin slice" xlink:href="__CAPTURE:mywattup-scroll.jpg__"/>
    <rect x="524" y="442" width="640" height="60" fill="url(#bas)"/>
    <rect class="shine rm" x="224" y="102" width="260" height="444" fill="url(#sh)" transform="skewX(-18)"/>
  </g>
  <rect x="1155" y="108" width="4" height="133" rx="2" fill="#4D6F7C" fill-opacity=".55" class="defile rm"/>
</g>
<g class="float2">
