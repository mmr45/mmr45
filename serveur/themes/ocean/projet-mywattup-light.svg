  <rect x="504" y="184" width="176" height="362" rx="32" fill="#0B0F17" stroke="#CDE6EA" stroke-width="2"/>
  <g clip-path="url(#ecran)">
    <rect x="512" y="192" width="160" height="346" fill="#111"/>
    <image class="mdefile" x="512" y="192" width="160" height="697.3333333333334" preserveAspectRatio="xMidYMin slice" xlink:href="__CAPTURE:mywattup-mobile.jpg__"/>
  </g>
  <rect x="562.0" y="199" width="60" height="17" rx="8.5" fill="#000"/>
  <rect x="552.0" y="529" width="80" height="4" rx="2" fill="#fff" fill-opacity=".55"/>
</g>
