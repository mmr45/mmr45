<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Bâtipro — Start a construction business without drowning in paperwork. Project eligibility test, Legal status simulator, Company filing, auto-generated, Compliant quotes as PDF. Live at batipro-ten.vercel.app.">
<title>Bâtipro — Start a construction business without drowning in paperwork. Project eligibility test, Legal status simulator, Company filing, auto-generated, Compliant quotes as PDF. Live at batipro-ten.vercel.app.</title>
<defs>
