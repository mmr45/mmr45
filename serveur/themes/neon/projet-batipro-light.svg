  <rect width="1200" height="560" fill="url(#g)" mask="url(#m)"/>
  <rect width="1200" height="560" fill="url(#gl)"/>
</g>
<rect x=".5" y=".5" width="1199" height="559" rx="21.5" fill="none" stroke="#F0CFE8"/>
