    <rect x="36" y="442" width="640" height="60" fill="url(#bas)"/>
    <rect class="shine rm" x="-264" y="102" width="260" height="444" fill="url(#sh)" transform="skewX(-18)"/>
  </g>
  <rect x="667" y="108" width="4" height="133" rx="2" fill="#6C4D82" fill-opacity=".55" class="defile rm"/>
</g>
<g class="float2">
