<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Bâtipro — Créer son entreprise du bâtiment, sans se noyer dans la paperasse. Test de qualification du projet, Simulation du statut juridique, Dossier INPI généré tout seul, Devis BTP conformes en PDF. En ligne sur batipro-ten.vercel.app.">
<title>Bâtipro — Créer son entreprise du bâtiment, sans se noyer dans la paperasse. Test de qualification du projet, Simulation du statut juridique, Dossier INPI généré tout seul, Devis BTP conformes en PDF. En ligne sur batipro-ten.vercel.app.</title>
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F6DEF0"/></pattern>
  <radialGradient id="fd" cx="25%" cy="45%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="1200" height="560" fill="url(#fd)"/></mask>
  <radialGradient id="gl" cx="25%" cy="45%" r="50%"><stop offset="0" stop-color="#D1009F" stop-opacity=".12"/><stop offset="1" stop-color="#D1009F" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1200" height="560" rx="22"/></clipPath>
  <clipPath id="shot"><path d="M36 102h640v386a14 14 0 0 1-14 14H50a14 14 0 0 1-14-14z"/></clipPath>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="bas" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
  <filter id="ombre" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="ecran"><rect x="534" y="192" width="160" height="346" rx="24"/></clipPath></defs>
<style>
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.float{animation:float 7s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.shine{animation:shine 6s 1.2s ease-in-out infinite}
@keyframes shine{0%{transform:skewX(-18deg) translateX(0)}35%,100%{transform:skewX(-18deg) translateX(1300px)}}
.hl{animation:hl 8s infinite}
.defile{animation:def 16s cubic-bezier(.65,0,.35,1) infinite}
image.defile{animation-name:def}rect.defile{animation-name:barre}
.mdefile{animation:mdef 16s 1.5s cubic-bezier(.65,0,.35,1) infinite}
.float2{animation:float 6s 1s ease-in-out infinite alternate-reverse}
@keyframes hl{0%{transform:translateY(120px)}7.5%,25%{transform:translateY(0)}32.5%,50%{transform:translateY(40px)}57.5%,75%{transform:translateY(80px)}82.5%,100%{transform:translateY(120px)}}
@keyframes def{0%,10%{transform:translateY(0)}28%,38%{transform:translateY(-288px)}56%,66%{transform:translateY(-560px)}80%,90%{transform:translateY(-800px)}100%{transform:translateY(0)}}@keyframes mdef{0%,10%{transform:translateY(0)}28%,38%{transform:translateY(-126px)}56%,66%{transform:translateY(-246px)}80%,90%{transform:translateY(-351px)}100%{transform:translateY(0)}}@keyframes barre{0%,10%{transform:translateY(0)}28%,38%{transform:translateY(92px)}56%,66%{transform:translateY(178px)}80%,90%{transform:translateY(255px)}100%{transform:translateY(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>

