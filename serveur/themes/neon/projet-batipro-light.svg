  <text x="728" y="214" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="23" font-weight="400" fill="#6C4D82">sans se noyer dans la paperasse.</text>
</g>
