<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Comment je construis mes SaaS : interface en JavaScript/TypeScript, hébergée sur Vercel, backend Supabase (Auth, Postgres, Edge Functions), paiements Stripe et IA ; chaque git push part en production.">
<title>Comment je construis mes SaaS : interface en JavaScript/TypeScript, hébergée sur Vercel, backend Supabase (Auth, Postgres, Edge Functions), paiements Stripe et IA ; chaque git push part en production.</title>
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F3EEC0"/></pattern>
  <radialGradient id="fd" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="1200" height="580" fill="url(#fd)"/></mask>
  <radialGradient id="gl" cx="50%" cy="30%" r="50%"><stop offset="0" stop-color="#A39400" stop-opacity=".12"/><stop offset="1" stop-color="#A39400" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1200" height="580" rx="22"/></clipPath></defs>
<style>
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.fill{transform-box:fill-box;transform-origin:left;animation:fill 8s infinite}
@keyframes fill{0%,10%{transform:scaleX(0);opacity:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}42%,86%{transform:scaleX(1);opacity:1}94%,100%{transform:scaleX(1);opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 8s infinite}
@keyframes pop{0%{transform:scale(0)}5%{transform:scale(1.25)}8%,86%{transform:scale(1)}94%,100%{transform:scale(0)}}
.act{animation:act 2s infinite}
@keyframes act{0%,100%{opacity:0}15%{opacity:.85}45%{opacity:0}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 8s 3.6s infinite}
@keyframes glow{0%{transform:scale(1);opacity:.9}12%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>

<g clip-path="url(#card)">
  <rect width="1200" height="580" fill="#FFFDE6"/>
  <rect width="1200" height="580" fill="url(#g)" mask="url(#m)"/>
  <rect width="1200" height="580" fill="url(#gl)"/>
</g>
