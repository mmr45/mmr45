  <circle cx="430" cy="128" r="6" fill="#00F0FF"/>
</g>

<g class="up" style="animation-delay:1.05s">
  <text x="430" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#F2F2FF" text-anchor="middle">Painting diploma</text>
  <text x="430" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#A3A3C7" text-anchor="middle">earned</text>
  <text x="430" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#A3A3C7" text-anchor="middle">with honours</text>
</g>
