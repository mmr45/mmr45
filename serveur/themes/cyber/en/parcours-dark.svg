  <text x="430" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1">2026</text>
</g>
<g class="pop" style="animation-delay:0.95s">
