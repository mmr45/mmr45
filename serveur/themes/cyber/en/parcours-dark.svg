  <rect x="643" y="56" width="134" height="34" rx="17" fill="#00F0FF" fill-opacity=".14"/>
  <text x="710" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1">JULY 2026</text>
</g>
<g class="pop" style="animation-delay:1.40s">
  <circle cx="710" cy="128" r="15" fill="#07070D" stroke="#00F0FF" stroke-width="4"/>
  <circle cx="710" cy="128" r="6" fill="#00F0FF"/>
</g>

<g class="up" style="animation-delay:1.50s">
  <text x="710" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#F2F2FF" text-anchor="middle">Bâtipro goes live</text>
  <text x="710" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#A3A3C7" text-anchor="middle">solo, from file one</text>
  <text x="710" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#A3A3C7" text-anchor="middle">to Stripe payments</text>
</g>
<g class="up" style="animation-delay:1.65s">
  <rect x="918" y="56" width="145" height="34" rx="17" fill="#FCEE0A" fill-opacity=".14"/>
  <text x="990" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#FCEE0A" text-anchor="middle" letter-spacing="1">SEPT. 2026</text>
</g>
<g class="pop" style="animation-delay:1.85s">
