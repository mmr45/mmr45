<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Path: apprentice painter in work-study 2024–2026, painting diploma with honours in 2026, Bâtipro live in July 2026, MyWattUp live in September 2026.">
<title>Path: apprentice painter in work-study 2024–2026, painting diploma with honours in 2026, Bâtipro live in July 2026, MyWattUp live in September 2026.</title>
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14141F"/></pattern>
  <radialGradient id="fd" cx="85%" cy="40%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="1200" height="330" fill="url(#fd)"/></mask>
  <radialGradient id="gl" cx="85%" cy="40%" r="50%"><stop offset="0" stop-color="#FCEE0A" stop-opacity=".2"/><stop offset="1" stop-color="#FCEE0A" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1200" height="330" rx="22"/></clipPath><linearGradient id="tl" gradientUnits="userSpaceOnUse" x1="150" x2="990" y1="0" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#FCEE0A"/></linearGradient></defs>
<style>
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.draw{stroke-dasharray:100 100;animation:draw 10s .2s infinite both}
@keyframes draw{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(.6,0,.3,1)}22%,88%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:-100}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 10s infinite}
@keyframes pop{0%{transform:scale(0)}4%{transform:scale(1.3)}6%,88%{transform:scale(1)}95%,100%{transform:scale(0)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>

<g clip-path="url(#card)">
  <rect width="1200" height="330" fill="#07070D"/>
  <rect width="1200" height="330" fill="url(#g)" mask="url(#m)"/>
  <rect width="1200" height="330" fill="url(#gl)"/>
</g>
<rect x=".5" y=".5" width="1199" height="329" rx="21.5" fill="none" stroke="#2C2C47"/>
<path class="draw" pathLength="100" d="M150 128H990" stroke="url(#tl)" stroke-width="5" stroke-linecap="round"/>
<path d="M1016 128H1172" stroke="#FCEE0A" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity=".6"/>
<text x="1172" y="112" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#62628A" text-anchor="end">what's next…</text>
<g class="up" style="animation-delay:0.30s">
  <rect x="72" y="56" width="156" height="34" rx="17" fill="#00F0FF" fill-opacity=".14"/>
  <text x="150" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1">2024 → 2026</text>
</g>
<g class="pop" style="animation-delay:0.50s">
