<circle class="ring rm" cx="990" cy="128" r="15" fill="none" stroke="#FCEE0A" stroke-width="2"/>
<g class="up" style="animation-delay:1.95s">
  <text x="990" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#F2F2FF" text-anchor="middle">MyWattUp goes live</text>
  <text x="990" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#A3A3C7" text-anchor="middle">sleep, sport,</text>
  <text x="990" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#A3A3C7" text-anchor="middle">nutrition</text>
