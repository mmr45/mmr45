<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-label="Activité">
  <title>Activité</title>
  <style>
    .u{stroke-dasharray:200;stroke-dashoffset:200;animation:u .8s .3s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes u{to{stroke-dashoffset:0}}
    .in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    .l{transform-box:fill-box;transform-origin:left;animation:l 1.2s .2s cubic-bezier(.6,0,.2,1) both}
    @keyframes l{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g class="in">
    <text x="4" y="50" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#F0600F">04</text>
    <text x="40" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#14213D" letter-spacing="-.5">Activité</text>
  </g>
  <path class="u" pathLength="200" d="M42 66 C 80 62, 120 68, 170 63" fill="none" stroke="#F0600F" stroke-width="5" stroke-linecap="round"/>
  <rect class="l" x="40" y="80" width="1156" height="1" fill="#E3DCCF"/>
  <text x="1196" y="50" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#97A3B6">// github</text>
</svg>
