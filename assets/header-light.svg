<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Osman Fauconnier — Peintre en bâtiment, développeur et fondateur. Du chantier au code.">
  <title>Osman Fauconnier — Du chantier au code</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E9E3D8" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="400" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="80%" cy="45%" r="45%">
      <stop offset="0" stop-color="#F0600F" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#F0600F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .sw{transform-box:view-box;transform-origin:960px 316px;transform:rotate(var(--a));animation:fan 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes fan{from{transform:rotate(0deg);opacity:0}to{transform:rotate(var(--a));opacity:1}}
    .stroke{stroke-dasharray:330;stroke-dashoffset:330;animation:paint .9s .55s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes paint{to{stroke-dashoffset:0}}
    .up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .t{animation:cyc 12s cubic-bezier(.4,0,.2,1) infinite both}
    @keyframes cyc{0%{opacity:0;transform:translateY(14px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-14px)}}
    .sway{transform-box:view-box;transform-origin:960px 330px;animation:sway 7s 1.6s ease-in-out infinite alternate}
    @keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
    .drop{animation:drop 5s ease-in infinite}
    @keyframes drop{0%{transform:translateY(0);opacity:0}10%{opacity:.9}70%{opacity:.9}100%{transform:translateY(46px);opacity:0}}
    .blink{animation:blink 1.1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#F7F4EE"/>
    <rect width="1200" height="400" fill="url(#g)" mask="url(#m)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <!-- annotations façon plan -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#97A3B6">
      <path d="M64 362H560" stroke="#E3DCCF" stroke-width="1"/>
      <path d="M64 356V368M560 356V368" stroke="#E3DCCF" stroke-width="1"/>
    </g>

    <g class="up">
      <text x="64" y="104" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" fill="#F0600F" letter-spacing=".5">// peintre · développeur · fondateur</text>
      <text x="62" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#14213D" letter-spacing="-1.5">Osman Fauconnier</text>
    </g>

    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#14213D" letter-spacing="-.5">
      <g class="t" style="animation-delay:-.6s">
        <path class="stroke" pathLength="330" d="M276 246 C 310 240, 360 249, 432 242" fill="none" stroke="#F0600F" stroke-width="13" stroke-linecap="round" opacity="0.75"/>
        <text x="64" y="238">Du chantier</text>
        <text x="282" y="238">au code<tspan fill="#F0600F">.</tspan></text>
      </g>
      <g class="t" style="animation-delay:3.4s"><text x="64" y="238">Préparer le support<tspan fill="#F0600F">.</tspan></text></g>
      <g class="t" style="animation-delay:7.4s"><text x="64" y="238">Soigner la finition<tspan fill="#F0600F">.</tspan></text></g>
    </g>

    <g class="up" style="animation-delay:.22s" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" fill="#5B6B85">
      <text x="64" y="286">Peintre en bâtiment, je conçois et développe seul</text>
      <text x="64" y="313">mes propres applications web.</text>
    </g>

    <g class="up" style="animation-delay:.32s" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="11.5" fill="#97A3B6">
      <text x="64" y="350">CAP PEINTURE · MENTION</text>
      <text x="252" y="350">2 SAAS LANCÉS EN SOLO</text>
      <text x="446" y="350">FR<tspan class="blink" fill="#F0600F">_</tspan></text>
    </g>

    <g class="sway">
    <g class="sw" style="--a:-30deg;animation-delay:0.15s">
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#8A7A5C" opacity="0.12" transform="translate(3 6)"/>
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#FFFFFF" stroke="#E3DCCF"/>
      <rect x="908" y="98" width="104" height="160" rx="8" fill="#1D5FA3" stroke="none"/>
      <text x="914" y="282" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213D">Bleu chantier</text>
      <text x="914" y="302" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#5B6B85">#1D5FA3</text>
      <circle cx="960" cy="316" r="3.5" fill="none" stroke="#C9C1B2" stroke-width="1.5"/>
    </g>
    <g class="sw" style="--a:-15deg;animation-delay:0.24s">
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#8A7A5C" opacity="0.12" transform="translate(3 6)"/>
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#FFFFFF" stroke="#E3DCCF"/>
      <rect x="908" y="98" width="104" height="160" rx="8" fill="#0B1220" stroke="none"/>
      <text x="914" y="282" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213D">Nuit</text>
      <text x="914" y="302" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#5B6B85">#0B1220</text>
      <circle cx="960" cy="316" r="3.5" fill="none" stroke="#C9C1B2" stroke-width="1.5"/>
    </g>
    <g class="sw" style="--a:0deg;animation-delay:0.33s">
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#8A7A5C" opacity="0.12" transform="translate(3 6)"/>
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#FFFFFF" stroke="#E3DCCF"/>
      <rect x="908" y="98" width="104" height="160" rx="8" fill="#EFE9DD" stroke="#00000014"/>
      <text x="914" y="282" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213D">Plâtre</text>
      <text x="914" y="302" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#5B6B85">#EFE9DD</text>
      <circle cx="960" cy="316" r="3.5" fill="none" stroke="#C9C1B2" stroke-width="1.5"/>
    </g>
    <g class="sw" style="--a:15deg;animation-delay:0.42s">
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#8A7A5C" opacity="0.12" transform="translate(3 6)"/>
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#FFFFFF" stroke="#E3DCCF"/>
      <rect x="908" y="98" width="104" height="160" rx="8" fill="#2EA043" stroke="none"/>
      <text x="914" y="282" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213D">Vert build</text>
      <text x="914" y="302" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#5B6B85">#2EA043</text>
      <circle cx="960" cy="316" r="3.5" fill="none" stroke="#C9C1B2" stroke-width="1.5"/>
    </g>
    <g class="sw" style="--a:30deg;animation-delay:0.51s">
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#8A7A5C" opacity="0.12" transform="translate(3 6)"/>
      <rect x="902" y="92" width="116" height="236" rx="12" fill="#FFFFFF" stroke="#E3DCCF"/>
      <rect x="908" y="98" width="104" height="160" rx="8" fill="#FF6A13" stroke="none"/>
      <text x="914" y="282" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#14213D">Orange finition</text>
      <text x="914" y="302" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#5B6B85">#FF6A13</text>
      <circle cx="960" cy="316" r="3.5" fill="none" stroke="#C9C1B2" stroke-width="1.5"/>
    </g></g>
    <circle class="drop" cx="1052" cy="318" r="4" fill="#FF6A13" style="animation-delay:2.2s"/>
    <circle class="drop" cx="866" cy="292" r="3" fill="#1D5FA3" style="animation-delay:4.1s"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="19.5" fill="none" stroke="#E3DCCF"/>
</svg>
