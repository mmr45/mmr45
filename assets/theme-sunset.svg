.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm{display:none}}</style>
<rect x="1" y="1" width="258" height="90" rx="18" fill="#170A14" stroke="#4D2440" stroke-width="2"/>
<rect x="1" y="1" width="258" height="90" rx="18" fill="url(#gl)"/>
<text x="22" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFEFF2">Coucher de soleil</text><circle cx="30" cy="62" r="9" fill="#FF5E5B"/><circle cx="56" cy="62" r="9" fill="#FFB627"/><circle cx="82" cy="62" r="9" fill="#7EE081"/><circle cx="108" cy="62" r="9" fill="#FFEFF2"/>
<g class="pulse"><text x="238" y="68" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#FF5E5B" text-anchor="end">choisir →</text></g>
</svg>
