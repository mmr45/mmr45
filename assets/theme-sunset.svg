<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="92" viewBox="0 0 260 92" role="img" aria-label="Thème Coucher de soleil">
<title>Thème Coucher de soleil</title>
<defs><radialGradient id="gl" cx="85%" cy="20%" r="70%"><stop offset="0" stop-color="#FF5E5B" stop-opacity=".3"/><stop offset="1" stop-color="#FF5E5B" stop-opacity="0"/></radialGradient></defs>
<style>
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
