<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Parcours : apprenti peintre 2024-2026, CAP Peinture avec mention en 2026, lancement de Bâtipro en juillet 2026, lancement de MyWattUp en septembre 2026.">
  <title>Mon parcours</title>
  <defs>
    <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="990" y2="0">
      <stop offset="0" stop-color="#1D5FA3"/>
      <stop offset="1" stop-color="#F0600F"/>
    </linearGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="990" y1="0" x2="1130" y2="0">
      <stop offset="0" stop-color="#F0600F" stop-opacity=".7"/>
      <stop offset="1" stop-color="#F0600F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".35" stop-color="#F0600F"/>
      <stop offset="1" stop-color="#F0600F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.6s 0.3s linear forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .node{transform-box:fill-box;transform-origin:center;animation:node .55s cubic-bezier(.3,1.6,.5,1) both}
    @keyframes node{from{transform:scale(0)}to{transform:scale(1)}}
    .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring .9s ease-out forwards}
    @keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 3.8s 3.50s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.8}60%,100%{transform:scale(2.6);opacity:0}}
    .txt{animation:txt .6s cubic-bezier(.2,.8,.2,1) both}
    @keyframes txt{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .spark{opacity:0;animation:spark 4.5s 3.70s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes spark{0%{transform:translateX(0);opacity:0}8%{opacity:1}62%{opacity:1}70%,100%{transform:translateX(840px);opacity:0}}
    .tail{stroke-dasharray:4 8;animation:tail 1.2s linear infinite,show .6s 2.90s both}
    @keyframes tail{to{stroke-dashoffset:-12}}
    @keyframes show{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="1199" height="249" rx="18" fill="#F7F4EE" stroke="#E3DCCF"/>
  <path d="M150 108H990" stroke="#E3DCCF" stroke-width="3" stroke-linecap="round"/>
  <path class="line" d="M150 108H990" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" pathLength="1000"/>
  <path class="tail" d="M1002 108H1130" stroke="url(#tail)" stroke-width="3" stroke-linecap="round"/>
  <circle class="spark" cx="150" cy="108" r="9" fill="url(#spark)"/>
  
    <circle cx="150" cy="108" r="10" fill="none" stroke="#1D5FA3" stroke-width="2" class="ring" style="animation-delay:0.30s"/>
    
    <g class="node" style="animation-delay:0.30s">
      <circle cx="150" cy="108" r="9" fill="#F7F4EE" stroke="#1D5FA3" stroke-width="3"/>
