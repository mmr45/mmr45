  <text x="150" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#5B6B85" text-anchor="middle">sur les chantiers</text>
