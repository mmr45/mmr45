  <text x="710" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#1D5FA3" text-anchor="middle" letter-spacing="1">JUILLET 2026</text>
</g>
