      <text x="430" y="154" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D">CAP Peinture</text>
      <text x="430" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">obtenu avec mention</text>
    </g>
    <circle cx="710" cy="108" r="10" fill="none" stroke="#1D5FA3" stroke-width="2" class="ring" style="animation-delay:2.03s"/>
    
    <g class="node" style="animation-delay:2.03s">
      <circle cx="710" cy="108" r="9" fill="#F7F4EE" stroke="#1D5FA3" stroke-width="3"/>
      <circle cx="710" cy="108" r="3.5" fill="#1D5FA3"/>
    </g>
    <g class="txt" style="animation-delay:2.13s">
      <rect x="645" y="56" width="130" height="24" rx="12" fill="#1D5FA3" opacity=".12"/>
      <text x="710" y="73" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#1D5FA3" letter-spacing="1">JUILLET 2026</text>
      <text x="710" y="154" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D">Lancement de Bâtipro</text>
      <text x="710" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">seul, du premier fichier</text><text x="710" y="205" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">au paiement Stripe</text>
    </g>
    <circle cx="990" cy="108" r="10" fill="none" stroke="#F0600F" stroke-width="2" class="ring" style="animation-delay:2.90s"/>
    <circle cx="990" cy="108" r="10" fill="none" stroke="#F0600F" stroke-width="2" class="pulse"/><circle cx="990" cy="108" r="10" fill="none" stroke="#F0600F" stroke-width="2" class="pulse" style="animation-delay:4.80s"/>
    <g class="node" style="animation-delay:2.90s">
      <circle cx="990" cy="108" r="9" fill="#F7F4EE" stroke="#F0600F" stroke-width="3"/>
      <circle cx="990" cy="108" r="3.5" fill="#F0600F"/>
    </g>
    <g class="txt" style="animation-delay:3.00s">
      <rect x="916" y="56" width="147" height="24" rx="12" fill="#F0600F" opacity=".12"/>
      <text x="990" y="73" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#F0600F" letter-spacing="1">SEPTEMBRE 2026</text>
      <text x="990" y="154" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D">Lancement de MyWattUp</text>
      <text x="990" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">coach énergie :</text><text x="990" y="205" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">sommeil, sport, nutrition</text>
    </g>
  <text class="txt" style="animation-delay:3.20s" x="1130" y="134" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#97A3B6">la suite…</text>
