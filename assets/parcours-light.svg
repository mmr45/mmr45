  <text x="430" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#5B6B85" text-anchor="middle">obtenu</text>
  <text x="430" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#5B6B85" text-anchor="middle">avec mention</text>
