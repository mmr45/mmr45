  <text x="990" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#F0600F" text-anchor="middle" letter-spacing="1">SEPT. 2026</text>
