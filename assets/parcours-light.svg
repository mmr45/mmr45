  <text x="710" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#5B6B85" text-anchor="middle">seul, du 1er fichier</text>
  <text x="710" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#5B6B85" text-anchor="middle">au paiement Stripe</text>
