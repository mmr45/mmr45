      <text x="150" y="154" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D">Apprenti peintre</text>
      <text x="150" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">BTP CFA</text><text x="150" y="205" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="14.5" fill="#5B6B85">Centre-Val de Loire</text>
    </g>
    <circle cx="430" cy="108" r="10" fill="none" stroke="#1D5FA3" stroke-width="2" class="ring" style="animation-delay:1.17s"/>
    
    <g class="node" style="animation-delay:1.17s">
      <circle cx="430" cy="108" r="9" fill="#F7F4EE" stroke="#1D5FA3" stroke-width="3"/>
