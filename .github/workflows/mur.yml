name: Mur de peinture

# Un visiteur clique sur un pot de couleur dans le README : ça ouvre une issue
# « peindre: <couleur> ». Ce workflow peint sa case, redessine le mur sur la
# branche « mur », répond sous l'issue puis la ferme.

on:
  issues:
    types: [opened]
  workflow_dispatch: {} # redessine le mur à la main

concurrency:
  group: mur # une seule touche à la fois, les suivantes attendent leur tour
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  peindre:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'peindre')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/checkout@v4
        with:
          ref: mur
          path: mur

      - name: Peint la case
        id: peint
        env:
          TITRE: ${{ github.event.issue.title }}
          AUTEUR: ${{ github.event.issue.user.login }}
          MESSAGE_FILE: ${{ runner.temp }}/message.md
        run: python3 code/.github/scripts/mur.py mur "$TITRE" "$AUTEUR"

      - name: Publie le mur
        working-directory: mur
        env:
          AUTEUR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Mur : touche de ${AUTEUR:-maintenance}"
          git push origin HEAD:mur

      - name: Répond et ferme l'issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          PEINT: ${{ steps.peint.outputs.peint }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/message.md"
          if [ "$PEINT" = "oui" ]; then raison=completed; else raison="not planned"; fi
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY" --reason "$raison"
